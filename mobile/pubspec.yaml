name: lahuma
description: "Ihsan (إحسان) — قرآنٌ يُتلى، وأجرٌ يُهدى. A Quran app built as a continuous charity for parents."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.8

  # State management / navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Networking
  dio: ^5.5.0

  # Local storage
  shared_preferences: ^2.2.3
  # Pinned below 2.5.0 (Pigeon JNI). From 2.5.0 the Android side registers
  # one instance per process, and any engine that detaches removes it: when
  # the adhan's background engine (AdhanWork) finishes just after launch,
  # every prefs read in the app fails for the session ("No instance with no
  # name has been registered"), so the adhan shows off and isn't scheduled.
  # 2.4.x uses a channel per engine. Re-check before upgrading.
  shared_preferences_android: 2.4.28
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Utilities
  equatable: ^2.0.5

  # Audio
  # 0.10.5+ turns Android audio offload off: with it on, some phones
  # (OnePlus / Oppo) sometimes started a recitation silently.
  just_audio: ^0.10.6
  # Now Playing ambient backgrounds (muted, looping, bundled assets).
  video_player: ^2.14.1
  # Adhan: where downloaded muezzin files live (and iOS Library/Sounds).
  path_provider: ^2.1.5

  # Fonts & UI
  google_fonts: ^6.2.1
  scrollable_positioned_list: ^0.3.8
  share_plus: ^13.3.1

  # Prayer times & scheduling (Fajr Call)
  adhan: ^2.0.0+1
  timezone: ^0.11.2
  flutter_local_notifications: ^22.3.3
  flutter_timezone: ^5.1.1
  geolocator: ^14.1.2
  url_launcher: ^6.3.3
  flutter_native_contact_picker: ^0.0.13
  geocoding: ^5.0.0
  qcf_quran: ^0.0.5
  animated_theme_switcher: ^2.0.10
  shimmer: ^4.0.0
  flutter_animate: ^4.5.2
  flutter_compass: ^0.8.1
  sensors_plus: ^7.1.1
  audio_service: ^0.18.19
  audio_session: ^0.2.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  # Performance scenarios (integration_test/perf_test.dart) and the driver
  # that writes their timeline summaries (test_driver/perf_driver.dart).
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Fake clock for timer tests (sleep_timer_test.dart); already in the tree
  # through flutter_test.
  fake_async: ^1.3.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.11
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true
  assets:
    # wordmark, and now_playing.png (lock-screen artwork when a reciter has
    # no portrait; the logo on a square).
    - assets/images/
    # Adhkar and duas (Hisn al-Muslim), built by tools/generate_adhkar.
    - assets/data/
    - assets/audio/Quran reciters/Ahmed bin Ali Al-Ajmi/
    # Bundled default adhan (full length), played in-app when no muezzin
    # has been downloaded. See docs/adhan.md.
    - assets/audio/adhan/
    # Now Playing backgrounds + posters, generated by
    # tools/generate_backgrounds/generate.py.
    - assets/videos/backgrounds/

# Native launch screen: `dart run flutter_native_splash:create` after a
# change. The colours repeat AppColors.splashBackground (light / dark) and the
# image is the gold wordmark from tools/generate_icon at 4x (160 pt wide), so
# the Flutter splash's first frame is the same picture.
flutter_native_splash:
  color: "#0D4F42"
  color_dark: "#07120F"
  image: assets/splash/wordmark.png
  image_dark: assets/splash/wordmark.png
  android_12:
    color: "#0D4F42"
    color_dark: "#07120F"
    image: assets/splash/wordmark_android12.png
    image_dark: assets/splash/wordmark_android12.png
  web: false
